<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="robots" content="noindex">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="YouTube">
  <title>YouTube</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="app.css?v=7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="mast">
    <div class="mast-start">
      <button type="button" class="icon-btn" id="nav-toggle" aria-label="選單">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>
      <a class="logo" href="#/" aria-label="首頁">
        <svg class="logo-mark" viewBox="0 0 90 64" aria-hidden="true">
          <rect width="90" height="64" rx="18" fill="#FF0000"/>
          <path d="M36 16 L68 32 L36 48 Z" fill="#fff"/>
        </svg>
        <span class="logo-word">YouTube</span>
      </a>
    </div>
    <form class="search" id="search" role="search">
      <button type="button" class="icon-btn search-back" id="search-back" aria-label="關閉搜尋">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <div class="search-box">
        <input id="q" type="search" placeholder="搜尋" autocomplete="off" enterkeyhint="search" aria-label="搜尋">
        <button type="submit" class="search-go" aria-label="搜尋">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </form>
    <div class="mast-end">
      <button type="button" class="icon-btn search-toggle" id="search-toggle" aria-label="搜尋">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>
  </header>
  <div class="body">
    <nav class="guide" id="guide" aria-label="導覽"></nav>
    <button type="button" class="scrim" id="scrim" aria-label="關閉選單" tabindex="-1"></button>
    <main id="main"></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="主選單"></nav>
  <script src="app.js?v=9"></script>
</body>
</html>
