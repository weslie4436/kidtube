name: refresh-catalog

on:
  schedule:
    - cron: "17 1,13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh whitelist catalog
        run: python tools/refresh_catalog.py
      - name: Commit catalog when it changed
        run: |
          git add catalog.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "更新白名單清單"
          git push
